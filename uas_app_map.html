<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700,900&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
  :root { --bg:#1d1d20; --panel:#232428; --card:#2b2c31; --line:#36373d; --ink:#eceef3; --muted:#9a9ca6;
          --blue:#2ea8ff; --green:#1f9d55; --red:#ff3b5c; --amber:#f5b400; --orange:#f5a524; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 Lato,system-ui,sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; background:#191a1d; }
  .leaflet-container { font:inherit; background:#191a1d; }
  .leaflet-control-attribution { background:rgba(29,29,32,.75) !important; color:#80828c !important; font-size:10px; }
  .leaflet-control-attribution a { color:#9aa4b8 !important; }
  button { font:inherit; color:inherit; }

  /* floating controls */
  .fab { width:46px; height:46px; border-radius:50%; border:0; background:#4a4c53; color:#e9eaee; display:grid; place-items:center;
         cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.45); transition:background .15s; }
  .fab:hover { background:#5a5c64; }
  .fab svg { width:21px; height:21px; }
  #wx { position:absolute; top:12px; left:12px; z-index:500; width:58px; height:58px; border-radius:50%; background:#4a4c53;
        display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.45);
        font-weight:700; font-size:15px; cursor:default; }
  #wx svg { width:22px; height:22px; margin-bottom:-2px; }
  #rightcol { position:absolute; top:12px; right:12px; z-index:500; display:flex; flex-direction:column; gap:14px; }
  #statusFab { background:var(--green); width:50px; height:50px; }
  #bottombar { position:absolute; left:12px; bottom:22px; z-index:500; display:flex; gap:10px; align-items:center; }
  #bottombar .fab { width:44px; height:44px; font-size:22px; }
  #layersBtn { height:48px; border-radius:24px; padding:0 22px 0 16px; border:0; background:#4a4c53; display:flex; gap:10px;
               align-items:center; font-size:17px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.45); }
  #layersBtn:hover { background:#5a5c64; }
  #layersBtn svg { width:22px; height:22px; }
  #ageBar { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:650; display:flex; gap:8px; align-items:center;
            background:rgba(38,39,43,.96); border:1px solid #3a3b41; border-radius:22px; padding:6px 8px 6px 16px; font-size:13px;
            box-shadow:0 3px 12px rgba(0,0,0,.5); max-width:calc(100% - 260px); }
  #ageBar.stale { border-color:#c98a00; } #ageBar.busy { border-color:#2ea8ff; }
  #ageTxt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ageBar .ab { background:#2ea8ff; color:#04121f; border:0; border-radius:14px; padding:5px 11px; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; }
  #ageBar .ab[data-scope=all] { background:#3a3c43; color:#eceef3; }
  #ageBar .ab:disabled { opacity:.45; cursor:default; }
  #ageBar .abx { background:none; border:0; color:#9a9ca6; font-size:15px; cursor:pointer; padding:0 6px; }
  #coords { position:absolute; left:0; bottom:0; z-index:500; font-size:11px; color:#c9cbd2; background:rgba(29,29,32,.8);
            padding:2px 8px; border-top-right-radius:6px; font-variant-numeric:tabular-nums; }

  /* airports */
  .apt { width:30px; height:30px; border-radius:50%; background:#1e9bff; border:2px solid #fff; display:grid; place-items:center;
         box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .apt svg { width:16px; height:16px; fill:#fff; }
  .apt.mil { background:#5b7aa6; }
  .apt-lbl { position:absolute; left:50%; bottom:33px; transform:translateX(-50%); color:#fff; font-weight:700; font-size:14px;
             white-space:nowrap; text-shadow:0 0 3px #000, 0 0 6px #000; pointer-events:none; }
  .hp { width:16px; height:16px; border-radius:50%; background:#6b6e78; border:1.5px solid #d6d8de; color:#fff; font-size:9px;
        font-weight:900; display:grid; place-items:center; }
  #map.z-lo .apt-lbl { display:none; }
  #map.z-vlo .apt { transform:scale(.6); }

  /* clicked point */
  .pinwrap { position:relative; width:0; height:0; }
  .pill { position:absolute; left:50%; bottom:58px; transform:translateX(-50%); padding:11px 22px; border-radius:6px; color:#fff;
          font-size:18px; font-weight:700; white-space:nowrap; cursor:pointer; border:1.5px solid rgba(255,255,255,.35);
          box-shadow:0 3px 10px rgba(0,0,0,.5); }
  .pin { position:absolute; left:-16px; top:-50px; width:32px; height:44px; }
  .ring { position:absolute; left:-22px; top:-22px; width:44px; height:44px; border-radius:50%; border:3px solid #f0c419;
          background:rgba(80,80,80,.45); }

  /* drawers */
  .drawer { position:absolute; top:0; bottom:0; z-index:700; background:var(--panel); box-shadow:0 0 24px rgba(0,0,0,.55);
            display:flex; flex-direction:column; transition:transform .22s ease; }
  #layersDrawer { left:0; width:340px; transform:translateX(-105%); }
  #layersDrawer.open { transform:none; }
  #brief { right:0; width:420px; transform:translateX(105%); }
  #brief.open { transform:none; }
  .dh { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line);
        font-size:18px; font-weight:700; }
  .x { background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; }
  .x:hover { color:#fff; }
  .scroll { overflow-y:auto; flex:1; }
  .seg { display:flex; margin:14px 18px 6px; background:#1b1c1f; border-radius:8px; padding:3px; }
  .seg button { flex:1; background:none; border:0; padding:7px 0; border-radius:6px; cursor:pointer; color:var(--muted); font-weight:700; }
  .seg button.on { background:#3a3c43; color:#fff; }
  .grp { border-bottom:1px solid var(--line); }
  .grow { display:flex; align-items:center; gap:14px; padding:18px 18px; }
  .gt { flex:1; font-size:17px; }
  .chev { background:none; border:0; color:var(--muted); cursor:pointer; font-size:20px; transition:transform .15s; padding:0 4px; }
  .grp.open .chev { transform:rotate(90deg); }
  .subs { display:none; padding:0 18px 12px 30px; }
  .grp.open .subs { display:block; }
  .srow { display:flex; align-items:center; gap:10px; padding:7px 4px; font-size:13.5px; cursor:pointer; border-radius:6px; }
  .srow:hover { background:#2c2d33; }
  .gt { cursor:pointer; }
  .srow .st { flex:1; }
  .srow .ct { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .srow .hint { display:block; color:var(--muted); font-size:11.5px; }
  .sw { width:16px; height:16px; border-radius:4px; border:2px solid; flex:none; }
  .tg { position:relative; width:42px; height:24px; flex:none; }
  .tg input { opacity:0; width:0; height:0; position:absolute; }
  .tg span { position:absolute; inset:0; border-radius:12px; background:#55575e; cursor:pointer; transition:background .15s; }
  .tg span:after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#3b3d44;
                   box-shadow:0 1px 2px rgba(0,0,0,.4); transition:left .15s; }
  .tg input:checked + span { background:var(--blue); }
  .tg input:checked + span:after { left:21px; background:#3b4252; }
  .tg.sm { width:34px; height:20px; } .tg.sm span:after { width:14px; height:14px; } .tg.sm input:checked + span:after { left:17px; }
  .ramp { display:flex; gap:2px; margin-top:4px; } .ramp i { flex:1; font-style:normal; font-size:10px; text-align:center; border-radius:3px; color:#111; padding:1px 0; }
  .sbar { display:flex; gap:8px; padding:10px 18px 4px; }
  .sbar input { flex:1; background:#1b1c1f; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px 10px; font:inherit; }
  .sbar button { background:#33353b; border:0; border-radius:8px; padding:0 12px; cursor:pointer; font-weight:700; font-size:12.5px; white-space:nowrap; }
  .arlist { max-height:280px; overflow-y:auto; }
  .hit-none { color:var(--muted); font-size:12.5px; padding:4px 2px; }
  #stSearch { width:100%; background:#1b1c1f; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px 10px; font:inherit; margin-bottom:8px; }
  .stbtns { display:flex; gap:8px; margin-bottom:8px; }
  .stbtns button { flex:1; background:#33353b; border:0; border-radius:6px; padding:6px 0; cursor:pointer; font-weight:700; font-size:12.5px; }
  .stbtns button:hover { background:#3d3f46; }
  #stList { max-height:300px; overflow-y:auto; }
  .strow { display:flex; align-items:center; gap:10px; padding:5px 2px; font-size:13.5px; cursor:pointer; }
  .strow span:first-of-type { flex:1; }
  .strow input { accent-color:var(--blue); width:16px; height:16px; }
  #loading { display:none; position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:800; background:#2b2c31;
             border:1px solid var(--line); border-radius:20px; padding:8px 16px; font-weight:700; box-shadow:0 2px 10px rgba(0,0,0,.5); }
  a.src { color:#7cc6ff; text-decoration:none; } a.src:hover { text-decoration:underline; }
  .foot { padding:14px 18px 20px; color:var(--muted); font-size:11.5px; }

  /* briefing */
  .bhead { padding:18px 18px 14px; border-bottom:1px solid var(--line); }
  .bstat { display:flex; align-items:center; gap:12px; }
  .bicon { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; flex:none; }
  .bicon svg { width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2.5; }
  .btitle { font-size:20px; font-weight:900; }
  .bsub { color:var(--muted); font-size:12.5px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { background:#33353b; border-radius:14px; padding:4px 10px; font-size:12px; }
  .chip b { color:#fff; }
  .sec { padding:12px 14px 4px; }
  .sech { font-size:11.5px; font-weight:900; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin:6px 4px 8px; }
  .card { background:var(--card); border-radius:10px; margin-bottom:10px; overflow:hidden; border:1px solid #33343a; }
  .card > summary { list-style:none; display:flex; gap:11px; align-items:flex-start; padding:12px 14px; cursor:pointer; }
  .card > summary::-webkit-details-marker { display:none; }
  .dot { width:12px; height:12px; border-radius:50%; margin-top:4px; flex:none; box-shadow:0 0 0 3px rgba(255,255,255,.06); }
  .ctitle { font-weight:700; font-size:14.5px; }
  .clayer { color:var(--muted); font-size:12px; margin-top:1px; }
  .tag { display:inline-block; font-size:10.5px; font-weight:900; letter-spacing:.4px; padding:2px 7px; border-radius:4px; margin-top:6px; text-transform:uppercase; }
  .tag.active { background:rgba(255,59,92,.18); color:#ff7a90; } .tag.upcoming { background:rgba(245,180,0,.16); color:#ffd166; }
  .tag.ended { background:#3a3b40; color:#a3a5ad; } .tag.perm { background:rgba(46,168,255,.15); color:#7cc6ff; }
  .cbody { padding:0 14px 14px 37px; font-size:13px; }
  .what { color:#cfd2da; margin-bottom:10px; }
  dl { display:grid; grid-template-columns:84px 1fr; gap:4px 10px; margin:0; font-size:12.5px; }
  dt { color:var(--muted); } dd { margin:0; word-break:break-word; }
  .more { margin-top:8px; } .more summary { color:var(--blue); cursor:pointer; font-weight:700; font-size:12.5px; }
  .more p { white-space:pre-wrap; color:#c2c5ce; margin:6px 0 0; font-size:12px; }
  table.f { width:100%; border-collapse:collapse; margin-top:6px; font-size:11.5px; }
  table.f td { border-top:1px solid #3a3b41; padding:3px 4px; vertical-align:top; word-break:break-word; }
  table.f td:first-child { color:var(--muted); width:42%; }
  .ev { display:flex; justify-content:space-between; gap:8px; padding:5px 0; border-top:1px solid #3a3b41; font-size:12.5px; }
  .ev:first-child { border-top:0; }
  .empty { color:var(--muted); text-align:center; padding:30px 20px; }
  .disc { color:#7d808a; font-size:11px; padding:6px 18px 22px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="wx" title="Weather at map center"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 9.5 4.25 4.25 0 0 0 7 18z"/></svg><span id="wxT">--°</span></div>

<div id="rightcol">
  <button class="fab" id="statusFab" title="Open briefing"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  <button class="fab" id="resetFab" title="Reset view (zoom back to the selected states)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="fab" id="pinFab" title="Brief map center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button>
</div>

<div id="bottombar">
  <button class="fab" id="zin" title="Zoom in">+</button>
  <button class="fab" id="zout" title="Zoom out">−</button>
  <button class="fab" id="locate" title="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <button id="layersBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>Layers</button>
</div>
<div id="coords"></div>
<div id="ageBar" style="display:none"><span id="ageTxt"></span>
  <button class="ab" data-scope="fast" title="TFRs and stadium events, a few minutes">Refresh TFRs</button>
  <button class="ab" data-scope="all" title="Every FAA layer, about 30 minutes">Refresh all</button>
  <button class="abx" id="ageX" title="Hide">✕</button></div>
<div id="loading"></div>

<aside class="drawer" id="layersDrawer">
  <div class="dh"><span>Layers</span><button class="x" id="ldClose">✕</button></div>
  <div class="seg" id="basemaps"><button data-b="dark" class="on">Dark</button><button data-b="light">Light</button><button data-b="sat">Satellite</button></div>
  <div class="sbar"><input id="q" placeholder="Search states, counties, districts, layers…" autocomplete="off"><button id="expAll">Expand all</button></div>
  <div class="scroll"><div id="statePanel"></div><div id="areaPanel"></div><div id="layerList"></div></div>
</aside>

<aside class="drawer" id="brief">
  <div class="dh"><span>Flight briefing</span><button class="x" id="bClose">✕</button></div>
  <div class="scroll" id="briefBody"><div class="empty">Click anywhere on the map to see every rule at that spot.</div></div>
</aside>

<script>
let DATA = __DATA__, AIRPORTS = __AIRPORTS__, OSM = {}; const META = __META__;

// ------------------------------------------------------------------ helpers
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmtDate = s => s ? new Date(s).toLocaleString([], { dateStyle:"medium", timeStyle:"short" }) : "";
function rel(ms) { const m = Math.round(ms / 6e4); if (m < 60) return "in " + m + " min"; const h = Math.round(m / 60);
  return h < 48 ? "in " + h + " h" : "in " + Math.round(h / 24) + " days"; }
function timeStatus(p) {
  const s = p.window_start ? Date.parse(p.window_start) : null, e = p.window_end ? Date.parse(p.window_end) : null, n = Date.now();
  if (!s && !e) return { k:"perm", label:"Always in effect" };
  if (e && e < n) return { k:"ended", label:"Ended" };
  if (s && s > n) return { k:"upcoming", label:"Starts " + rel(s - n) };
  return { k:"active", label:"Active now" + (e ? " · ends " + rel(e - n) : "") };
}

// restricted-area schedules (parsed from FAA TIMESOFUSE by the build; local times)
const DAYN = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
function usDst(d) {   // second Sunday of March 2:00 to first Sunday of November 2:00 (US rule)
  const y = d.getUTCFullYear(), sun = (m, n) => { const x = new Date(Date.UTC(y, m, 1)); return 1 + (7 - x.getUTCDay()) % 7 + 7 * (n - 1); };
  return d >= new Date(Date.UTC(y, 2, sun(2, 2), 7)) && d < new Date(Date.UTC(y, 10, sun(10, 1), 6));
}
const daysTxt = ds => ds.length === 7 ? "daily" : ds.length > 2 && ds.every((v, i) => !i || v === ds[i - 1] + 1)
  ? DAYN[ds[0]] + "–" + DAYN[ds[ds.length - 1]] : ds.map(i => DAYN[i]).join(", ");
function schedStatus(p) {
  if (!p.schedule) return null;
  let s; try { s = JSON.parse(p.schedule); } catch { return null; }
  if (s.type === "continuous") return { k:"active", label:"Continuous (24/7)" };
  if (s.type !== "scheduled") return { k:"notam", label:s.type === "notam" ? "Active only by NOTAM: check NOTAMs" : "Times: " + s.raw };
  const off = (s.utc_offset ?? -5) + (s.dst && usDst(new Date()) ? 1 : 0);
  const loc = new Date(Date.now() + off * 3600e3), dow = (loc.getUTCDay() + 6) % 7, prev = (dow + 6) % 7;
  const mins = loc.getUTCHours() * 60 + loc.getUTCMinutes(), hm = t => +t.slice(0, 2) * 60 + +t.slice(2);
  const on = s.windows.some(w => { const a = hm(w.start), b = hm(w.end);
    return b > a ? w.days.includes(dow) && mins >= a && mins < b : (w.days.includes(dow) && mins >= a) || (w.days.includes(prev) && mins < b); });
  const desc = s.windows.map(w => `${w.start}–${w.end} ${daysTxt(w.days)}`).join("; ") + " local" +
               (s.other_times_notam ? "; other times by NOTAM" : "") + (s.approx_sun ? " (sunrise/sunset approx.)" : "");
  return on ? { k:"active", label:"Active now · " + desc }
            : { k:s.other_times_notam ? "notam" : "inactive", label:(s.other_times_notam ? "Not scheduled now (can be activated by NOTAM) · " : "Not active now · ") + desc };
}
function fmtAlt(ft, ref) {
  if (ref === "UNL") return "Unlimited";
  if (ref === "NOTAM") return "set by NOTAM";
  if (ft == null) return "not specified";
  if (ref === "FL") return "FL" + String(Math.round(ft / 100)).padStart(3, "0");
  if (ft === 0 && ref === "AGL") return "Surface";
  return Math.round(ft).toLocaleString() + " ft " + (ref || "");
}
const altText = p => (p.floor_ft == null && p.ceiling_ft == null && !p.ceiling_ref) ? "See notes" : fmtAlt(p.floor_ft, p.floor_ref) + " → " +
  ((p.fields || {}).UPPER_DESC === "AA" ? "up to (not incl.) 18,000 ft MSL" : fmtAlt(p.ceiling_ft, p.ceiling_ref));
function hoursText(p) {
  const f = p.fields || {};
  if (f.WKHR_CODE === "H24") return "Continuous (H24)";
  if (f.WKHR_RMK || f.TIMESOFUSE) return "Part-time: " + (f.WKHR_RMK || f.TIMESOFUSE);
  return "Always in effect";
}
const nm = (a, b) => { const R = 3440.065, t = Math.PI / 180, dLa = (b[1] - a[1]) * t, dLo = (b[0] - a[0]) * t;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * t) * Math.cos(b[1] * t) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

// ------------------------------------------------------------------ layer definitions (AirHub-like palette)
const LAANC = [[0,"#ff5a6e","0"],[100,"#ff9f43","100"],[200,"#ffd43b","200"],[300,"#a9e34b","300"],[400,"#38d9a9","400"]];
const laancColor = c => (LAANC.find(([v]) => (c ?? 0) <= v) || LAANC[4])[1];
const PINK = "#ff2d6f", RED = "#ff3b30";
// FAA dataset each layer comes from (official FAA ArcGIS item pages / FAA sites)
const ITEM = id => "https://www.arcgis.com/home/item.html?id=" + id;
const SOURCES = {
  laanc_grid:["FAA UAS Facility Map Data", ITEM("4254d2f81e5241cc8ba5883b63ae397c")],
  class_airspace:["FAA Class Airspace", ITEM("c6a62360338e408cb1512366ad61559e")],
  special_use_airspace:["FAA Special Use Airspace", ITEM("dd0d1b726e504137ab3c41b21835d05b")],
  prohibited_areas:["FAA Prohibited Areas", ITEM("354ee0c77484461198ebf728a2fca50c")],
  nsufr:["FAA National Security UAS Flight Restrictions", ITEM("0270b9d8a5d34217856cc03aaf833309")],
  nsufr_part_time:["FAA Part-Time National Security UAS Flight Restrictions", ITEM("3a4a808aec634e4e8e4b0ee0d5366da6")],

const maskLayer = L.geoJSON(null, { pane:"mask", interactive:false, style:{ stroke:false, fillColor:"#141517", fillOpacity:0.93 } }).addTo(map);
const selOutline = L.geoJSON(null, { pane:"mask", interactive:false, style:{ color:"#2ea8ff", weight:2, fill:false } }).addTo(map);
function renderAreas() {
  const panel = document.getElementById("areaPanel"); if (!panel || !STATES) return;
  AREA_INDEX = {};
  const groups = { counties:[], districts:[] };
  for (const c of checked) { const sd = STATE_DATA[c]; if (!sd) continue;
    for (const k of ["counties", "districts"]) for (const a of sd[k] || []) {
      AREA_INDEX[a.id] = a; groups[k].push({ ...a, st:c, label:k === "counties" ? `${a.name}, ${c}` : a.name }); } }
  for (const id of [...areaSel]) if (!AREA_INDEX[id]) areaSel.delete(id);
  const open = new Set([...panel.querySelectorAll(".grp.open")].map(e => e.dataset.g));
  const sec = (k, title) => `<div class="grp ${open.has(k) ? "open" : ""}" data-g="${k}">
    <div class="grow"><span class="gt">${title}</span><span class="ct">${groups[k].filter(a => areaSel.has(a.id)).length} on</span><button class="chev">›</button></div>
    <div class="subs">${groups[k].length ? `<div class="stbtns"><button data-clear="${k}">Clear</button></div><div class="arlist">${groups[k].map(a =>
      `<label class="strow" data-q="${esc((a.label + " " + a.st).toLowerCase())}"><input type="checkbox" data-area="${a.id}" ${areaSel.has(a.id) ? "checked" : ""}><span>${esc(a.label)}</span></label>`).join("")}</div>`
      : `<div class="hit-none">Check a state above to list its ${title.toLowerCase()}.</div>`}</div></div>`;
  panel.innerHTML = sec("counties", "Counties") + sec("districts", "Congressional districts");
  panel.querySelectorAll(".chev").forEach(b => b.onclick = () => b.closest(".grp").classList.toggle("open"));
  panel.querySelectorAll("[data-area]").forEach(cb => cb.onchange = () => {
    cb.checked ? areaSel.add(cb.dataset.area) : areaSel.delete(cb.dataset.area); areasChanged(cb.checked ? cb.dataset.area : null); });
  panel.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => {
    const k = b.dataset.clear; for (const id of [...areaSel]) if (id[0] === k[0]) areaSel.delete(id); areasChanged(null); });
  runSearch();
}
function areasChanged(zoomId) {
  localStorage.setItem("uas_areas", JSON.stringify([...areaSel]));
  updateMask(); renderAreas(); refreshPoints(); hl.clearLayers(); if (pinMarker) pinMarker.remove();
  if (zoomId && AREA_INDEX[zoomId]) map.fitBounds(L.geoJSON({ type:AREA_INDEX[zoomId].type, coordinates:AREA_INDEX[zoomId].coords }).getBounds());
}
function updateMask() {
  maskLayer.clearLayers(); selOutline.clearLayers(); selUnion = null;
  const feats = [...areaSel].map(id => AREA_INDEX[id]).filter(Boolean)
    .map(a => ({ type:"Feature", properties:{}, geometry:{ type:a.type, coordinates:a.coords } }));
  if (!feats.length) return;
  try {
    selUnion = feats.length === 1 ? feats[0] : turf.union(turf.featureCollection(feats));
    const world = turf.polygon([[[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]]]);
    maskLayer.addData(turf.difference(turf.featureCollection([world, selUnion])));
    selOutline.addData(selUnion);
  } catch (e) { console.error(e); }
}
function inSelection(x, y) { return !selUnion || contains({ geometry:selUnion.geometry, _bb:gbbox(selUnion.geometry) }, x, y); }

// ------------------------------------------------------------------ unified search + expand / collapse all
function runSearch() {
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  document.querySelectorAll("#layersDrawer .strow").forEach(r => r.style.display = !q || (r.dataset.q || "").includes(q) ? "" : "none");
  document.querySelectorAll("#layerList .srow").forEach(r => r.style.display = !q || r.textContent.toLowerCase().includes(q) ? "" : "none");
  if (q) document.querySelectorAll("#layersDrawer .grp").forEach(g => {
    const hit = [...g.querySelectorAll(".strow, .srow")].some(r => r.style.display !== "none");
    g.classList.toggle("open", hit); });
}
document.getElementById("q").oninput = runSearch;
document.getElementById("expAll").onclick = e => {
  const expand = e.target.textContent === "Expand all";
  document.querySelectorAll("#layersDrawer .grp").forEach(g => g.classList.toggle("open", expand));
  e.target.textContent = expand ? "Collapse all" : "Expand all";
};

// ------------------------------------------------------------------ buttons, coords, weather
document.getElementById("zin").onclick = () => map.zoomIn();
document.getElementById("zout").onclick = () => map.zoomOut();
document.getElementById("resetFab").onclick = home;
document.getElementById("pinFab").onclick = () => brief(map.getCenter());
document.getElementById("locate").onclick = () => navigator.geolocation
  ? navigator.geolocation.getCurrentPosition(p => { const ll = L.latLng(p.coords.latitude, p.coords.longitude); map.setView(ll, 13); brief(ll); },
                                             () => alert("Location not available here (browser blocked it)."))
  : alert("Location not supported.");
map.on("mousemove", e => document.getElementById("coords").textContent = e.latlng.lat.toFixed(6) + "  " + e.latlng.lng.toFixed(6));
let wxTimer;
async function weather(ll) {
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${ll.lat.toFixed(3)}&longitude=${ll.lng.toFixed(3)}` +
            `&current=temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph`;
  try { const r = await fetch(u); return (await r.json()).current; } catch { return null; }
}
const updateWx = async () => { const c = await weather(map.getCenter()); if (c) {
  document.getElementById("wxT").textContent = Math.round(c.temperature_2m) + "°";
  document.getElementById("wx").title = `Map center: ${Math.round(c.temperature_2m)}°F, wind ${Math.round(c.wind_speed_10m)} mph, gusts ${Math.round(c.wind_gusts_10m)} mph`; } };
map.on("moveend", () => { clearTimeout(wxTimer); wxTimer = setTimeout(updateWx, 700); });
updateWx();


// ------------------------------------------------------------------ data age bar + refresh (works when opened through serve_map.py)
function ago(iso) {
  if (!iso) return "unknown";
  const m = Math.round((Date.now() - Date.parse(iso)) / 6e4);
  if (m < 60) return m + " min ago"; const hr = Math.round(m / 60);
  return hr < 48 ? hr + " h ago" : Math.round(hr / 24) + " days ago";
}
function renderAge() {
  const rows = (META.manifest || []).filter(r => r.status === "ok" && r.fetched_utc);
  if (!rows.length) return;
  const fast = rows.filter(r => ["tfr_active", "seams"].includes(r.layer)).map(r => r.fetched_utc).sort().pop();
  const rest = rows.filter(r => !["tfr_active", "seams", "notam_tfr"].includes(r.layer)).map(r => r.fetched_utc).sort()[0];
  const key = "uas_agebar_hidden_" + (fast || "") + (rest || "");
  const bar = document.getElementById("ageBar");
  if (sessionStorage.getItem(key)) return;
  document.getElementById("ageTxt").textContent = `FAA data: TFRs & stadium events ${ago(fast)} · other layers ${ago(rest)}`;
  bar.classList.toggle("stale", Date.now() - Date.parse(fast) > 6 * 3600e3);
  bar.style.display = "flex";
  document.getElementById("ageX").onclick = () => { sessionStorage.setItem(key, "1"); bar.style.display = "none"; };
}
const canRefresh = fetch("api/status", { cache:"no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
async function pollRefresh() {
  const bar = document.getElementById("ageBar"), txt = document.getElementById("ageTxt");
  bar.classList.add("busy"); bar.style.display = "flex";
  document.querySelectorAll("#ageBar .ab").forEach(b => b.disabled = true);
  for (;;) {
    const s = await fetch("api/status", { cache:"no-store" }).then(r => r.json()).catch(() => null);
    if (!s) { txt.textContent = "Lost contact with the map launcher. Is the RUN_MAP window still open?"; return; }
    const last = (s.log || []).slice(-1)[0] || "";
    if (s.running) { txt.textContent = `Refreshing: ${s.step}${last ? " · " + last.slice(0, 70) : ""}`; await new Promise(r => setTimeout(r, 2000)); continue; }
    if (s.ok) { txt.textContent = "Refresh done. Reloading the map…"; setTimeout(() => location.reload(), 800); }
    else { txt.textContent = "Refresh failed: " + last; document.querySelectorAll("#ageBar .ab").forEach(b => b.disabled = false); bar.classList.remove("busy"); }
    return;
  }
}
document.querySelectorAll("#ageBar .ab").forEach(b => b.onclick = async () => {
  if (!(await canRefresh)) {
    document.getElementById("ageTxt").textContent = "This feature is not able to be rendered without a local server hosting this website";
    return;
  }
  if (b.dataset.scope === "all" && !confirm("Refresh every FAA layer? This takes about 30 minutes. You can keep using the map meanwhile.")) return;
  const r = await fetch("api/refresh?scope=" + b.dataset.scope, { method:"POST", headers:{ "X-Map-Refresh":"1" } });
  if (r.ok || r.status === 409) pollRefresh();
});
renderAge();
canRefresh.then(s => { if (s && s.running) pollRefresh(); });

// ------------------------------------------------------------------ hit testing
function gbbox(g) { let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  const w = x => { if (typeof x[0] === "number") { if (x[0] < a) a = x[0]; if (x[0] > c) c = x[0]; if (x[1] < b) b = x[1]; if (x[1] > d) d = x[1]; } else x.forEach(w); };
  w(g.coordinates); return [a, b, c, d]; }
function inRing(x, y, r) { let o = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
  const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) o = !o; } return o; }
const inPoly = (x, y, rings) => inRing(x, y, rings[0]) && !rings.slice(1).some(h => inRing(x, y, h));
function contains(f, x, y) { const b = f._bb; if (x < b[0] || x > b[2] || y < b[1] || y > b[3]) return false;
  const g = f.geometry; return g.type === "Polygon" ? inPoly(x, y, g.coordinates) : g.type === "MultiPolygon" && g.coordinates.some(p => inPoly(x, y, p)); }

// ------------------------------------------------------------------ status + briefing
const ICONS = {
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>',
  warn:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
};
function overall(hits) {
  const live = h => ["active", "perm"].includes(timeStatus(h.p).k) && h.layer !== "stadiums_3nm";
  if (hits.some(h => h.p.effect === "prohibited" && live(h))) return { k:"nofly", label:"No-Fly Zone", color:"#e5223f", icon:"x" };
  if (hits.some(h => h.p.effect === "restricted" && schedStatus(h.p)?.k !== "inactive")) return { k:"restr", label:"Restricted Airspace", color:"#e8681f", icon:"warn" };
  if (hits.some(h => h.p.effect === "authorization_required")) return { k:"auth", label:"Authorization Required", color:"#1b7fd1", icon:"key" };
  return { k:"clear", label:"Clear to Fly", color:"#1f7a3f", icon:"check" };
}
let pinMarker = null, hl = L.geoJSON(null, { renderer:canvas, interactive:false, style:{ color:"#fff", weight:2.5, fillOpacity:0, dashArray:null } }).addTo(map);
map.on("click", e => { if (!inSelection(e.latlng.lng, e.latlng.lat)) return; brief(e.latlng); });

async function brief(ll) {
  const x = ll.lng, y = ll.lat, hits = [];
  for (const k in DATA) for (const f of DATA[k]) {
    if (k === "seams" && timeStatus(f.properties).k === "ended") continue;
    if (contains(f, x, y)) hits.push({ layer:k, p:f.properties, f });
  }
  hits.sort((a, b) => (EFFECT[a.p.effect]?.rank ?? 9) - (EFFECT[b.p.effect]?.rank ?? 9));
  const st = overall(hits);
  hl.clearLayers(); hits.filter(h => !["seams", "laanc_grid"].includes(h.layer)).forEach(h => hl.addData(h.f));
  hl.bringToFront();
  if (pinMarker) pinMarker.remove();
  pinMarker = L.marker(ll, { interactive:false, zIndexOffset:1000, icon:L.divIcon({ className:"", iconSize:[0, 0], html:`
    <div class="pinwrap"><div class="ring"></div>
      <svg class="pin" viewBox="0 0 32 44"><path d="M16 1C8 1 2 7 2 15c0 10 14 27 14 27s14-17 14-27C30 7 24 1 16 1z" fill="${st.color}" stroke="#fff" stroke-width="2"/><circle cx="16" cy="15" r="5" fill="#fff"/></svg>
      <div class="pill" style="background:${st.color}" onclick="document.getElementById('brief').classList.add('open')">${st.label}</div></div>` }) }).addTo(map);
  const fab = document.getElementById("statusFab");
  fab.style.background = st.color; fab.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3">${ICONS[st.icon]}</svg>`;

  const laanc = hits.filter(h => h.layer === "laanc_grid").map(h => h.p.ceiling_ft).filter(v => v != null);
  const near = AIRPORTS.filter(isPublicApt).map(a => ({ a, d:nm([x, y], [a.x, a.y]) })).sort((p, q) => p.d - q.d).slice(0, 3);
  const chips = [];
  if (laanc.length) chips.push(Math.min(...laanc) > 0 ? `LAANC up to <b>${Math.min(...laanc)} ft</b>` : `<b>LAANC 0 ft</b>: FAADroneZone only`);
  if (near[0]) chips.push(`Nearest airport <b>${esc(near[0].a.id)}</b> ${near[0].d.toFixed(1)} NM`);
  // a rule only counts as a restriction while it is in effect; scheduled/upcoming ones are advisories
  const live = h => ["active", "perm"].includes(timeStatus(h.p).k) && schedStatus(h.p)?.k !== "inactive" && h.layer !== "stadiums_3nm";
  const restr = h => ["prohibited", "restricted"].includes(h.p.effect);
  const groups = [["Restrictions (in effect now)", h => restr(h) && live(h)],
                  ["Authorizations", h => h.p.effect === "authorization_required"],
                  ["Advisories (incl. scheduled TFRs)", h => h.p.effect === "caution" || (restr(h) && !live(h))], ["No drone restriction (incl. FRIAs & fixed sites)", h => h.p.effect === "allowed"]];
  let body = `<div class="bhead"><div class="bstat"><div class="bicon" style="background:${st.color}"><svg viewBox="0 0 24 24">${ICONS[st.icon]}</svg></div>
      <div><div class="btitle">${st.label}</div><div class="bsub">${y.toFixed(5)}, ${x.toFixed(5)} · ${hits.length} rule${hits.length === 1 ? "" : "s"} here</div></div></div>
      <div class="chips" id="chips">${chips.map(c => `<span class="chip">${c}</span>`).join("")}<span class="chip" id="wxchip">Weather…</span></div></div>`;
  if (!hits.length) body += `<div class="empty">No mapped restrictions at this spot. Standard Part 107 / recreational rules still apply (400 ft AGL, visual line of sight).</div>`;
  for (const [title, test] of groups) {
    const hs = hits.filter(test); if (!hs.length) continue;
    body += `<div class="sec"><div class="sech">${title} · ${hs.length}</div>`;
    const seams = hs.filter(h => h.layer === "seams"); let seamsDone = false;
    for (const h of hs) {
      if (h.layer === "seams") { if (!seamsDone) { body += seamsCard(seams); seamsDone = true; } continue; }
      body += card(h);
    }
    body += `</div>`;
  }
  const osmHits = [];
  for (const [cat, title, col] of OSM_CATS) {
    if (!state["osm_" + cat]) continue;
    for (const f of OSM[cat] || []) {
      const g = f.geometry;
      const d = g.type === "Point" ? nm([x, y], g.coordinates) : (contains(f, x, y) ? 0 : null);
      if (d !== null && d <= 0.5) osmHits.push({ f, title, col, d });
    }
  }
  osmHits.sort((a, b) => a.d - b.d);
  if (osmHits.length) body += `<div class="sec"><div class="sech">Infrastructure nearby · OpenStreetMap (informational)</div><div class="card"><div class="cbody" style="padding:12px 14px">${
    osmHits.slice(0, 15).map(o => { const p = o.f.properties;
      return `<div class="ev"><span><span class="dot" style="display:inline-block;margin:0 6px 0 0;background:${o.col}"></span><b>${esc(p.name || "(unnamed)")}</b> · ${esc(o.title)}${p.operator ? " · " + esc(p.operator) : ""}${p.voltage ? " · " + esc(p.voltage) + " V" : ""}</span>
        <span style="white-space:nowrap">${o.d ? o.d.toFixed(2) + " NM" : "here"} · <a class="src" href="${esc(p.osm_url)}" target="_blank">OSM ↗</a></span></div>`; }).join("")}</div></div></div>`;
  if (near.length) body += `<div class="sec"><div class="sech">Nearby airports</div><div class="card"><div class="cbody" style="padding:12px 14px">${near.map(n =>
    `<div class="ev"><span><b>${esc(n.a.id)}</b> ${esc(n.a.name)}</span><span style="white-space:nowrap">${n.d.toFixed(1)} NM</span></div>`).join("")}</div></div></div>`;
  body += `<div class="disc">Reference only. Confirm with an FAA-approved app (B4UFLY / LAANC) before flying.</div>`;
  document.getElementById("briefBody").innerHTML = body;
  document.getElementById("brief").classList.add("open");
  const c = await weather(ll), wc = document.getElementById("wxchip");
  if (wc) wc.innerHTML = c ? `${Math.round(c.temperature_2m)}°F · wind <b>${Math.round(c.wind_speed_10m)}</b> mph, gusts <b>${Math.round(c.wind_gusts_10m)}</b>` : "Weather unavailable";
}

function card(h) {
  const p = h.p, e = EFFECT[p.effect] || EFFECT.caution, t = timeStatus(p), L0 = h.layer;
  const title = L0 === "laanc_grid" ? `LAANC ${p.ceiling_ft > 0 ? "up to " + p.ceiling_ft + " ft" : "0 ft (no auto-approval)"}` : (p.name || LAYER_INFO[L0]?.title);
  let when;
  const ss = schedStatus(p);
  if (ss) when = esc(ss.label);
  else if (L0 === "stadiums_3nm") when = "Only during qualifying events";
  else if (t.k === "perm") when = esc(hoursText(p));
  else when = `${p.window_start ? esc(fmtDate(p.window_start)) : "now"} → ${p.window_end ? esc(fmtDate(p.window_end)) : "until further notice"}`;
  const tag = ss ? `<span class="tag ${ss.k === "active" ? "active" : ss.k === "inactive" ? "ended" : "upcoming"}">${ss.k === "active" ? "Active now" : ss.k === "inactive" ? "Not active now" : "By NOTAM"}</span>`
    : L0 === "stadiums_3nm" ? `<span class="tag upcoming">Event-based</span>` : `<span class="tag ${t.k}">${esc(t.label)}</span>`;
  const fields = Object.entries(p.fields || {});
  return `<details class="card"><summary><span class="dot" style="background:${e.color}"></span><div style="flex:1;min-width:0">
      <div class="ctitle">${esc(title)}</div><div class="clayer">${esc(LAYER_INFO[L0]?.title || L0)} · ${esc(e.label)}</div>${tag}</div></summary>
    <div class="cbody"><div class="what">${esc(explain(L0, p))}</div>
      <dl>${L0 === "laanc_grid" ? `<dt>Airport</dt><dd>${esc(p.name)}</dd>` : `<dt>Altitude</dt><dd>${esc(altText(p))}</dd>`}
        <dt>When</dt><dd>${when}</dd><dt>Rule</dt><dd>${esc(p.citation || "—")}</dd>
        <dt>Source</dt><dd>${srcLink(L0)}</dd>
        <dt>Updated</dt><dd>${esc(fmtDate(p.source_last_edit) || "—")}${p.source_url && p.source_url.includes("tfr.faa.gov") ? ` · <a style="color:#7cc6ff" href="${esc(p.source_url)}" target="_blank">tfr.faa.gov</a>` : ""}</dd></dl>
      ${p.notes ? `<details class="more" ${p.notes.length < 240 ? "open" : ""}><summary>Notes</summary><p>${esc(p.notes)}</p></details>` : ""}
      ${fields.length ? `<details class="more"><summary>All FAA fields (${fields.length})</summary><table class="f">${fields.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></details>` : ""}
    </div></details>`;
}
function seamsCard(hs) {
  hs.sort((a, b) => Date.parse(a.p.window_start) - Date.parse(b.p.window_start));
  const p0 = hs[0].p, live = hs.some(h => timeStatus(h.p).k === "active");
  return `<details class="card" ${live ? "open" : ""}><summary><span class="dot" style="background:${EFFECT.prohibited.color}"></span><div style="flex:1">
      <div class="ctitle">${hs.length} stadium event${hs.length > 1 ? "s" : ""} scheduled</div><div class="clayer">Stadium event TFR · No-fly during events</div>
      <span class="tag ${live ? "active" : "upcoming"}">${live ? "Event TFR active now" : "Next: " + esc(fmtDate(p0.window_start))}</span></div></summary>
    <div class="cbody"><div class="what">${esc(explain("seams", p0))}</div>
      <dl><dt>Altitude</dt><dd>${esc(altText(p0))}</dd><dt>Rule</dt><dd>${esc(p0.citation)}</dd></dl>
      <div style="margin-top:10px">${hs.slice(0, 30).map(h => { const t = timeStatus(h.p);
        return `<div class="ev"><span>${esc(h.p.name)}</span><span style="white-space:nowrap">${esc(fmtDate(h.p.window_start))}${t.k === "active" ? ' <span class="tag active" style="margin:0">Now</span>' : ""}</span></div>`; }).join("")}</div>
    </div></details>`;
}
document.getElementById("bClose").onclick = () => document.getElementById("brief").classList.remove("open");
document.getElementById("statusFab").onclick = () => document.getElementById("brief").classList.add("open");
if (STATES) applyStates(null);
</script>
